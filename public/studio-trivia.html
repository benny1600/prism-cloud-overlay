<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISM Studio Trivia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0 0 86px;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;pointer-events:none}
#trivia{width:min(1120px,88vw);opacity:0;transform:scale(.97);transition:.22s}#trivia.show{opacity:1;transform:scale(1)}
.panel{background:rgba(13,15,20,.94);border:2px solid rgba(255,255,255,.17);border-radius:28px;padding:30px 34px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.badge{font-size:21px;font-weight:900;letter-spacing:.08em}.phase{font-size:18px;font-weight:900;padding:8px 14px;border-radius:999px;background:#ffffff1c}
.question{font-size:clamp(30px,3.1vw,52px);font-weight:900;line-height:1.13;text-align:center;margin:8px 0 25px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{display:flex;align-items:center;gap:14px;min-height:76px;padding:13px 18px;border-radius:18px;background:#ffffff17;border:2px solid #ffffff1a;font-size:clamp(21px,2vw,31px);font-weight:800}.letter{display:grid;place-items:center;flex:0 0 45px;height:45px;border-radius:50%;background:#fff;color:#111;font-weight:900}.answer.correct{background:rgba(31,151,79,.38);border-color:rgba(95,239,143,.85)}
.explanation{display:none;margin-top:18px;padding-top:18px;border-top:1px solid #ffffff29;font-size:clamp(18px,1.5vw,25px);text-align:center}.explanation.show{display:block}
#leaders{display:none}#leaders.show{display:block}.leaderTitle{text-align:center;font-size:42px;font-weight:900;margin-bottom:20px}.leaderRow{display:grid;grid-template-columns:70px 58px 1fr auto;align-items:center;gap:13px;background:#ffffff17;border-radius:17px;padding:9px 18px;margin:10px 0;font-size:25px;font-weight:800}
.avatar,.fallback{width:50px;height:50px;border-radius:50%;border:2px solid #ffffffe8;box-sizing:border-box;flex:none}.avatar{object-fit:cover;background:#ffffff1f}.fallback{display:grid;place-items:center;background:#ffffff24;font-size:21px;font-weight:900}
#tickerView{position:fixed;left:0;right:0;bottom:0;height:82px;overflow:hidden}#ticker{height:82px;display:flex;align-items:center;width:max-content;will-change:transform}.group{display:flex;align-items:center;gap:18px;padding-right:18px;flex:none}.player{height:62px;display:flex;align-items:center;gap:10px;padding:0 18px 0 8px;border-radius:34px;background:rgba(15,15,18,.91);box-shadow:0 3px 14px #0006;font-weight:800;flex:none}.rank{font-size:20px;font-weight:900}.name{font-size:23px;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:24px;font-weight:900}
@keyframes move{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--travel),0,0)}}@media(max-width:800px){.answers{grid-template-columns:1fr}.panel{padding:22px}}
</style></head><body>
<div id="stage"><div id="trivia"><div class="panel"><div id="qview"><div class="top"><div id="num" class="badge">TRIVIA</div><div id="phase" class="phase">QUESTION</div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="exp" class="explanation"></div></div><div id="leaders"><div class="leaderTitle">🏆 LEADERBOARD</div><div id="leaderRows"></div></div></div></div></div>
<div id="tickerView"><div id="ticker"><div id="g1" class="group"></div><div id="g2" class="group"></div></div></div>
<script>
(()=>{const p=new URLSearchParams(location.search),room=p.get('room')||'mobiletest',speed=Math.max(20,Math.min(300,Number(p.get('speed')||60))),limit=Math.max(1,Math.min(500,Number(p.get('limit')||500))),$=s=>document.querySelector(s);let ws,retry=1000,last='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),initial=s=>(String(s||'').trim()[0]||'?').toUpperCase();
function av(r){let u=String(r.avatarUrl||'').trim();return u?`<img class="avatar" src="${esc(u)}" referrerpolicy="no-referrer">`:`<span class="fallback">${esc(initial(r.name))}</span>`}
function trivia(s){let t=s.trivia||{},ph=String(t.phase||'idle'),vis=t.visible!==false&&ph!=='idle';$('#trivia').classList.toggle('show',vis);if(!vis)return;if(ph==='leaderboard'){ $('#qview').style.display='none';$('#leaders').classList.add('show');let rows=(Array.isArray(t.leaderboard)?t.leaderboard:(t.tickerRows||[])).slice(0,10);$('#leaderRows').innerHTML=rows.map(r=>`<div class="leaderRow"><div>#${esc(r.rank??'')}</div>${av(r)}<div>${esc(r.name||'Viewer')}</div><div>${Number(r.score||0)} pts</div></div>`).join('');return}$('#leaders').classList.remove('show');$('#qview').style.display='';$('#num').textContent='TRIVIA #'+(t.questionNumber||'');$('#phase').textContent=({question:'QUESTION',open:'ANSWERS OPEN',closed:'ANSWERS CLOSED',revealed:'ANSWER REVEALED'}[ph]||ph.toUpperCase());$('#question').textContent=t.question||'';let a=t.answers||{},c=String(t.correct||'').toUpperCase();$('#answers').innerHTML=['A','B','C','D'].map(k=>`<div class="answer ${ph==='revealed'&&k===c?'correct':''}"><span class="letter">${k}</span><span>${esc(a[k]||'')}</span></div>`).join('');$('#exp').textContent=t.explanation||'';$('#exp').classList.toggle('show',ph==='revealed'&&!!t.explanation)}
function player(r){let n=Number(r.score||0);return `<div class="player"><span class="rank">#${esc(r.rank??'')}</span>${av(r)}<span class="name">${esc(r.name||'Viewer')}</span><span class="score">${n} ${n===1?'pt':'pts'}</span></div>`}
function ticker(s){let rows=(s.trivia?.tickerRows||[]).slice(0,limit),sig=JSON.stringify(rows);if(sig===last)return;last=sig;let g1=$('#g1'),g2=$('#g2'),t=$('#ticker');t.style.animation='none';g1.innerHTML=rows.map(player).join('');g2.innerHTML='';if(!rows.length)return;let original=g1.innerHTML;while(g1.scrollWidth<innerWidth+80)g1.insertAdjacentHTML('beforeend',original);g2.innerHTML=g1.innerHTML;requestAnimationFrame(()=>requestAnimationFrame(()=>{let d=g1.getBoundingClientRect().width;if(!d)return;t.style.setProperty('--travel',-d+'px');t.style.animation=`move ${d/speed}s linear infinite`}))}
function render(s){trivia(s);ticker(s)}function connect(){try{ws?.close()}catch{}let proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=overlay`);ws.onopen=()=>retry=1000;ws.onmessage=e=>{try{let m=JSON.parse(e.data);if(m.type==='state')render(m.state||{})}catch{}};ws.onclose=()=>{setTimeout(connect,retry);retry=Math.min(retry*1.6,10000)};ws.onerror=()=>{try{ws.close()}catch{}}}connect()})();
</script></body></html>
