<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM Trivia Scores - Smooth OBS Ticker</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
.viewport{position:absolute;left:0;right:0;bottom:0;height:82px;overflow:hidden}
.marquee{position:absolute;left:0;bottom:0;height:82px;display:flex;align-items:center;width:max-content;will-change:transform}
.group{display:flex;align-items:center;gap:18px;padding-right:18px;flex:none}
.player{display:flex;align-items:center;gap:10px;height:62px;padding:0 18px 0 8px;border-radius:34px;background:rgba(15,15,18,.88);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.35);flex:none}
.rank{font-size:20px;font-weight:900}
.avatar,.avatar-fallback{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.92);box-sizing:border-box;flex:none}
.avatar{object-fit:cover;display:block;background:rgba(255,255,255,.12)}
.avatar-fallback{display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:21px;font-weight:900}
.name{font-size:23px;font-weight:800;max-width:330px;overflow:hidden;text-overflow:ellipsis}
.score{font-size:24px;font-weight:900;margin-left:4px}
@keyframes tickerMove{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--travel),0,0)}}
</style>
</head>
<body>
<div class="viewport"><div id="marquee" class="marquee"><div id="g1" class="group"></div><div id="g2" class="group"></div></div></div>
<script>
(()=>{
const p=new URLSearchParams(location.search);
const room=p.get('room')||'mobiletest';
const speed=Math.max(20,Math.min(300,Number(p.get('speed')||60)));
const limit=Math.max(1,Math.min(100,Number(p.get('limit')||100)));
const marquee=document.getElementById('marquee'),g1=document.getElementById('g1'),g2=document.getElementById('g2');
let ws,retry=1000,lastSig='';

const initial=n=>{n=String(n||'').trim();return n?n.charAt(0).toUpperCase():'?'};

function playerNode(row){
 const card=document.createElement('div');card.className='player';
 const rank=document.createElement('span');rank.className='rank';rank.textContent='#'+(row.rank??'');card.appendChild(rank);
 if(row.avatarUrl){
  const img=document.createElement('img');img.className='avatar';img.src=row.avatarUrl;img.alt='';img.referrerPolicy='no-referrer';
  img.onerror=()=>{const f=document.createElement('span');f.className='avatar-fallback';f.textContent=initial(row.name);img.replaceWith(f)};
  card.appendChild(img);
 }else{const f=document.createElement('span');f.className='avatar-fallback';f.textContent=initial(row.name);card.appendChild(f)}
 const name=document.createElement('span');name.className='name';name.textContent=row.name||'Viewer';card.appendChild(name);
 const score=document.createElement('span');score.className='score';const n=Number(row.score||0);score.textContent=n+' '+(n===1?'pt':'pts');card.appendChild(score);
 return card;
}

function rebuild(rows){
 marquee.style.animation='none';
 g1.replaceChildren();g2.replaceChildren();
 for(const row of rows)g1.appendChild(playerNode(row));
 // Ensure one group is wider than viewport so the duplicated strips create a seamless loop.
 const baseWidth=g1.scrollWidth;
 if(baseWidth>0 && baseWidth<innerWidth+80){
   const originals=Array.from(g1.children).map(n=>n.cloneNode(true));
   while(g1.scrollWidth<innerWidth+80) for(const n of originals) g1.appendChild(n.cloneNode(true));
 }
 for(const n of Array.from(g1.children))g2.appendChild(n.cloneNode(true));
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const distance=g1.getBoundingClientRect().width;
   if(!distance)return;
   marquee.style.setProperty('--travel',(-distance)+'px');
   marquee.style.animation=`tickerMove ${distance/speed}s linear infinite`;
 }));
}

function render(state){
 const rows=Array.isArray(state?.trivia?.tickerRows)?state.trivia.tickerRows.slice(0,limit):[];
 const sig=JSON.stringify(rows);
 if(sig===lastSig)return;
 lastSig=sig;
 rebuild(rows);
}
function connect(){
 try{ws?.close()}catch{}
 const proto=location.protocol==='https:'?'wss:':'ws:';
 ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=overlay`);
 ws.onopen=()=>retry=1000;
 ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')render(m.state||{})}catch{}};
 ws.onclose=()=>{setTimeout(connect,retry);retry=Math.min(retry*1.6,10000)};
 ws.onerror=()=>{try{ws.close()}catch{}};
}
connect();
})();
</script>
</body>
</html>
