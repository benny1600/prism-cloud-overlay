<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Overlay Control</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e0f12;color:#f6f7f9}button,input,select{font:inherit}main{max-width:900px;margin:auto;padding:14px 14px 90px}.top{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.96);backdrop-filter:blur(8px);padding:10px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.status{font-size:13px;opacity:.75}.tabs{display:flex;gap:8px;margin-top:10px}.tab{padding:10px 14px;border-radius:12px;border:1px solid #30343b;background:#17191e;color:#fff}.tab.active{background:#f3f4f6;color:#111}.panel{display:none;margin-top:14px}.panel.active{display:block}.card{border:1px solid #2c3037;background:#15171b;border-radius:16px;padding:12px}.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.media-card{border:1px solid #2b3037;border-radius:15px;background:#15171b;overflow:hidden}.preview{aspect-ratio:16/10;background:#090a0c;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:contain}.info{padding:10px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;opacity:.65;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button,.bigbtn{border:0;border-radius:12px;min-height:44px;font-weight:800}.play{background:#f4f5f7;color:#111}.secondary{background:#252932;color:#fff}.danger{background:#782a2a;color:#fff}.clear{position:fixed;z-index:30;bottom:12px;left:50%;transform:translateX(-50%);width:min(860px,calc(100% - 24px));min-height:58px;border:0;border-radius:16px;background:#c93b3b;color:white;font-weight:900;font-size:18px}.uploadbox{border:2px dashed #343942;border-radius:18px;padding:18px;text-align:center}.uploadbox input{width:100%;margin:10px 0}.field{width:100%;padding:10px;border-radius:11px;border:1px solid #353a43;background:#111318;color:white;font-size:13px}select.field{font-size:12px;padding:9px 7px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.login{position:fixed;inset:0;z-index:99;background:#0e0f12;display:flex;align-items:center;justify-content:center;padding:18px}.loginbox{width:min(420px,100%);border:1px solid #30343b;background:#15171b;border-radius:20px;padding:20px}.loginbox h1{margin-top:0}.hidden{display:none!important}.toast{position:fixed;z-index:120;top:14px;left:50%;transform:translateX(-50%);background:#242831;border:1px solid #3a404b;padding:10px 14px;border-radius:12px;display:none;max-width:90%}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="login" class="login">
  <div class="loginbox"><h1>Overlay Control</h1><p>Enter your private control key. It stays in this browser tab only.</p><input id="keyInput" class="field" type="password" autocomplete="current-password" placeholder="Control key"><button id="loginBtn" class="bigbtn play" style="width:100%;margin-top:10px">CONNECT</button><p class="status">Room: <span id="loginRoom"></span></p></div>
</div>
<main>
<div class="top">
  <div class="row"><div class="grow"><strong>Mobile Overlay</strong><div id="conn" class="status">Disconnected</div></div><button id="logout" class="tab">Lock</button></div>
  <div class="tabs"><button class="tab active" data-tab="library">Library</button><button class="tab" data-tab="upload">Upload</button><button class="tab" data-tab="text">Text</button></div>
</div>

<section id="library" class="panel active">
  <div class="row" style="margin-bottom:10px"><button id="refresh" class="tab">Refresh</button><div id="count" class="status"></div></div>
  <div id="libraryGrid" class="library"></div>
</section>

<section id="upload" class="panel">
  <div class="uploadbox"><h2>Add media</h2><p>Images, GIFs, MP4/WebM video, or audio. Recommended mobile limit: 75 MB per file.</p><input id="fileInput" type="file" accept="image/*,video/mp4,video/webm,audio/*"><button id="uploadBtn" class="bigbtn play" style="width:100%">UPLOAD TO CLOUD</button><div id="uploadStatus" class="status" style="margin-top:10px"></div></div>
</section>

<section id="text" class="panel">
  <div class="card"><h2>Text overlay</h2><input id="textValue" class="field" maxlength="300" placeholder="Type your message"><div class="settings"><select id="textPos" class="field"><option value="bottom">Bottom</option><option value="top">Top</option></select><select id="textMode" class="field"><option value="static">Static</option><option value="scroll">Scroll left</option></select></div><div class="settings"><label class="card" style="padding:8px">Text color<input id="textColor" class="field" type="color" value="#ffffff" style="height:48px;padding:4px;margin-top:6px"></label><label class="card" style="padding:8px">Text size<select id="textSize" class="field" style="margin-top:6px"><option value="32">Small</option><option value="48" selected>Medium</option><option value="64">Large</option><option value="84">Extra large</option></select></label></div><div class="settings"><label class="card" style="padding:8px">Scroll speed<select id="textSpeed" class="field" style="margin-top:6px"><option value="18">Slow</option><option value="12" selected>Normal</option><option value="8">Fast</option></select></label><button id="showText" class="bigbtn play">SHOW / UPDATE TEXT</button></div><button id="hideText" class="bigbtn secondary" style="width:100%">HIDE TEXT</button></div>
</section>
</main>
<button id="clear" class="clear">CLEAR SCREEN</button>
<script>
(() => {
  const q=new URLSearchParams(location.search),room=q.get('room')||'mobiletest';
  let key=sessionStorage.getItem('overlayControlKey')||'',ws=null,retry=1000;
  const $=s=>document.querySelector(s),grid=$('#libraryGrid'),conn=$('#conn'),toast=$('#toast');
  $('#loginRoom').textContent=room;
  const note=(m)=>{toast.textContent=m;toast.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>toast.style.display='none',2200)};
  function authHeaders(extra={}){return {'X-Control-Key':key,...extra}}
  async function api(path,opts={}){opts.headers=authHeaders(opts.headers||{});const r=await fetch(path,opts);if(r.status===401){lock();throw new Error('Unauthorized')}const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`Request failed (${r.status})`);return data}
  function lock(){key='';sessionStorage.removeItem('overlayControlKey');try{ws?.close()}catch{};$('#login').classList.remove('hidden');conn.textContent='Locked'}
  async function unlock(){const k=$('#keyInput').value.trim();if(!k)return;key=k;try{await api('/api/media/list');sessionStorage.setItem('overlayControlKey',key);$('#login').classList.add('hidden');connect();loadLibrary()}catch(e){key='';note('Control key not accepted')}}
  $('#loginBtn').onclick=unlock;$('#keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('#logout').onclick=lock;
  function connect(){
    try{ws?.close()}catch{};const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=control&key=${encodeURIComponent(key)}`);
    ws.onopen=()=>{retry=1000;conn.textContent=`Connected • ${room}`};ws.onclose=e=>{if(!key)return;conn.textContent=e.code===1008?'Unauthorized':'Reconnecting…';setTimeout(connect,retry);retry=Math.min(retry*1.6,10000)};ws.onerror=()=>ws.close();
  }
  function cmd(payload){if(ws?.readyState===1)ws.send(JSON.stringify(payload));else note('Controller is reconnecting')}
  const fmt=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
  function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  async function loadLibrary(){
    grid.innerHTML='<div class="status">Loading…</div>';try{const d=await api('/api/media/list');$('#count').textContent=`${d.items.length} item${d.items.length===1?'':'s'}`;grid.innerHTML='';if(!d.items.length){grid.innerHTML='<div class="card">No media yet. Open Upload to add your first graphic or video.</div>';return}d.items.forEach(renderCard)}catch(e){grid.innerHTML=`<div class="card">${esc(e.message)}</div>`}
  }
  function renderCard(item){
    const card=document.createElement('div');card.className='media-card';
    const prev=item.kind==='image'?`<img loading="lazy" src="${item.url}" alt="">`:item.kind==='video'?`<video preload="metadata" muted src="${item.url}"></video>`:`<div>${item.kind.toUpperCase()}</div>`;

    const imageControls=item.kind==='image'
      ? `<div class="settings">
          <select class="field size">
            <option value="20">20% size</option><option value="30">30% size</option><option value="40" selected>40% size</option>
            <option value="50">50% size</option><option value="60">60% size</option><option value="75">75% size</option><option value="100">100% size</option>
          </select>
          <select class="field dur">
            <option value="0">Stay on + layer</option><option value="5000">5 sec</option><option value="8000">8 sec</option><option value="10000">10 sec</option>
          </select>
        </div>
        <div class="settings">
          <select class="field tin">
            <option value="none">In: None</option>
            <option value="fade" selected>In: Fade</option>
            <option value="slide-up">In: Slide up</option>
            <option value="slide-down">In: Slide down</option>
            <option value="slide-left">In: Slide left</option>
            <option value="slide-right">In: Slide right</option>
            <option value="zoom">In: Zoom</option>
            <option value="pop">In: Pop</option>
          </select>
          <select class="field tout">
            <option value="none">Out: None</option>
            <option value="fade" selected>Out: Fade</option>
            <option value="slide-up">Out: Slide up</option>
            <option value="slide-down">Out: Slide down</option>
            <option value="slide-left">Out: Slide left</option>
            <option value="slide-right">Out: Slide right</option>
            <option value="zoom">Out: Zoom</option>
            <option value="pop">Out: Pop</option>
          </select>
        </div>
        <div class="settings">
          <select class="field tms">
            <option value="250">250 ms</option>
            <option value="500" selected>500 ms</option>
            <option value="750">750 ms</option>
            <option value="1000">1 sec</option>
          </select>
          <span></span>
        </div>`
      : '';

    card.innerHTML=`<div class="preview">${prev}</div><div class="info"><div class="name" title="${esc(item.name)}">${esc(item.name)}</div><div class="meta">${esc(item.kind)} • ${fmt(item.size)}</div><div class="settings"><select class="field pos"><option value="center">Center</option><option value="top">Top center</option><option value="bottom">Bottom center</option><option value="left">Left center</option><option value="right">Right center</option><option value="top-left">Top left</option><option value="top-right">Top right</option><option value="bottom-left">Bottom left</option><option value="bottom-right">Bottom right</option></select><span></span></div>${imageControls}<div class="actions"><button class="play show">${item.kind==='video'?'PLAY':'SHOW'}</button><button class="secondary rename">RENAME</button><button class="danger delete">DELETE</button><button class="secondary hide">HIDE/STOP</button></div></div>`;

    const pos=card.querySelector('.pos'),dur=card.querySelector('.dur'),size=card.querySelector('.size');
    const tin=card.querySelector('.tin'),tout=card.querySelector('.tout'),tms=card.querySelector('.tms');

    card.querySelector('.show').onclick=()=>{
      if(item.kind==='image')cmd({
        action:'showImage',
        src:item.url,
        duration:Number(dur?.value||0),
        position:pos.value,
        size:Number(size?.value||40),
        transitionIn:tin?.value||'fade',
        transitionOut:tout?.value||'fade',
        transitionMs:Number(tms?.value||500)
      });
      else if(item.kind==='video')cmd({action:'playVideo',src:item.url,position:pos.value,volume:1});
      else note('Audio-only playback is not enabled yet')
    };

    card.querySelector('.hide').onclick=()=>cmd(
      item.kind==='video'
        ? {action:'stopVideo'}
        : {
            action:'hideImage',
            src:item.url,
            transitionOut:tout?.value||'fade',
            transitionMs:Number(tms?.value||500)
          }
    );

    card.querySelector('.delete').onclick=async()=>{
      if(!confirm(`Delete “${item.name}” permanently from cloud storage?`))return;
      try{
        await api('/api/media/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:item.key})});
        if(item.kind==='image')cmd({action:'hideImage',src:item.url,transitionOut:tout?.value||'fade',transitionMs:Number(tms?.value||500)});
        note('Deleted');loadLibrary()
      }catch(e){note(e.message)}
    };

    card.querySelector('.rename').onclick=async()=>{
      const name=prompt('New display name:',item.name);
      if(!name||name===item.name)return;
      try{
        await api('/api/media/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:item.key,name})});
        note('Renamed');loadLibrary()
      }catch(e){note(e.message)}
    };

    grid.appendChild(card);
  }
  $('#refresh').onclick=loadLibrary;
  $('#uploadBtn').onclick=async()=>{const f=$('#fileInput').files[0];if(!f){note('Choose a file first');return}if(f.size>75*1024*1024){note('File is over 75 MB');return}$('#uploadStatus').textContent=`Uploading ${f.name}…`;try{await api(`/api/media/upload?name=${encodeURIComponent(f.name)}`,{method:'POST',headers:{'content-type':f.type||'application/octet-stream','X-File-Name':f.name},body:f});$('#uploadStatus').textContent='Upload complete';$('#fileInput').value='';note('Media uploaded');loadLibrary();document.querySelector('[data-tab="library"]').click()}catch(e){$('#uploadStatus').textContent=e.message}};
  $('#showText').onclick=()=>cmd({action:'showText',value:$('#textValue').value,position:$('#textPos').value,color:$('#textColor').value,size:Number($('#textSize').value),scroll:$('#textMode').value==='scroll',scrollSeconds:Number($('#textSpeed').value)});$('#hideText').onclick=()=>cmd({action:'hideText'});$('#clear').onclick=()=>cmd({action:'clear'});
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab))});
  if(key){$('#login').classList.add('hidden');connect();loadLibrary()}
})();
</script>
</body>
</html>
