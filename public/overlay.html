<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mobile Stream Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    *{box-sizing:border-box}
    #stage{position:fixed;inset:0;pointer-events:none}
    #graphic,#video{position:absolute;inset:0;width:100%;height:100%;display:none}
    #graphic{object-fit:contain}
    #video{object-fit:contain}
    #text{
      position:absolute;left:5%;right:5%;bottom:6%;
      display:none;text-align:center;color:white;
      font:700 clamp(24px,4vw,64px)/1.1 system-ui,sans-serif;
      text-shadow:0 2px 8px rgba(0,0,0,.9);
    }
    #status{
      display:none;position:absolute;top:8px;left:8px;
      padding:5px 8px;border-radius:8px;
      background:rgba(0,0,0,.55);color:#fff;
      font:12px system-ui,sans-serif
    }
  </style>
</head>
<body>
<div id="stage">
  <img id="graphic" alt="">
  <video id="video" playsinline preload="metadata"></video>
  <div id="text"></div>
  <div id="status"></div>
</div>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const room = p.get("room") || "default";
  const debug = p.get("debug") === "1";

  const graphic = document.querySelector("#graphic");
  const video = document.querySelector("#video");
  const text = document.querySelector("#text");
  const status = document.querySelector("#status");
  let imageTimer = null;
  let ws = null;
  let retry = 1000;

  if (debug) status.style.display = "block";

  function setStatus(s){ if(debug) status.textContent=s; }

  function applyState(state){
    clearTimeout(imageTimer);

    if(state.graphic?.src){
      graphic.src = state.graphic.src;
      graphic.style.objectFit = state.graphic.fit || "contain";
      graphic.style.display = "block";
      if(state.graphic.duration > 0){
        imageTimer = setTimeout(() => graphic.style.display = "none", state.graphic.duration);
      }
    } else {
      graphic.removeAttribute("src");
      graphic.style.display = "none";
    }

    if(state.video?.src){
      const desired = new URL(state.video.src, location.href).href;
      if(video.src !== desired){
        video.src = state.video.src;
        video.style.objectFit = state.video.fit || "contain";
        video.volume = Math.max(0, Math.min(1, Number(state.video.volume ?? 1)));
        video.style.display = "block";
        video.play().catch(()=>{});
      }
    } else {
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";
    }

    if(state.text?.value){
      text.textContent = state.text.value;
      text.style.display = "block";
      text.style.top = state.text.position === "top" ? "6%" : "";
      text.style.bottom = state.text.position === "top" ? "" : "6%";
    } else {
      text.textContent = "";
      text.style.display = "none";
    }
  }

  function connect(){
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=overlay`);

    ws.onopen = () => {
      retry = 1000;
      setStatus("connected");
    };
    ws.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        if(msg.type === "state") applyState(msg.state || {});
      } catch {}
    };
    ws.onclose = () => {
      setStatus("reconnecting");
      setTimeout(connect, retry);
      retry = Math.min(retry * 1.6, 10000);
    };
    ws.onerror = () => ws.close();
  }

  connect();
})();
</script>
</body>
</html>
