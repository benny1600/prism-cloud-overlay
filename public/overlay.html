<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Stream Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
*{box-sizing:border-box}#stage{position:fixed;inset:0;pointer-events:none}
.media{position:absolute;display:none;max-width:100%;max-height:100%}
#graphic,#video{width:100%;height:100%;object-fit:contain;inset:0}
.pos-top-left{inset:4% auto auto 4%!important;width:36%!important;height:36%!important}
.pos-top-right{inset:4% 4% auto auto!important;width:36%!important;height:36%!important}
.pos-bottom-left{inset:auto auto 4% 4%!important;width:36%!important;height:36%!important}
.pos-bottom-right{inset:auto 4% 4% auto!important;width:36%!important;height:36%!important}
#text{position:absolute;left:5%;right:5%;bottom:6%;display:none;text-align:center;color:white;font:800 clamp(24px,4vw,64px)/1.1 system-ui,sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.95)}
#status{display:none;position:absolute;top:8px;left:8px;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font:12px system-ui,sans-serif}
</style>
</head>
<body>
<div id="stage">
  <img id="graphic" class="media" alt="">
  <video id="video" class="media" playsinline preload="metadata"></video>
  <div id="text"></div><div id="status"></div>
</div>
<script>
(() => {
  const q=new URLSearchParams(location.search), room=q.get('room')||'default', debug=q.get('debug')==='1';
  const graphic=document.querySelector('#graphic'), video=document.querySelector('#video'), text=document.querySelector('#text'), status=document.querySelector('#status');
  let ws,retry=1000,imageTimer=null,currentVideoSrc=''; if(debug)status.style.display='block';
  const setStatus=s=>{if(debug)status.textContent=s};
  function position(el,pos){el.className='media'; if(pos&&pos!=='center')el.classList.add('pos-'+pos)}
  function applyState(state){
    clearTimeout(imageTimer);
    if(state.graphic?.src){graphic.src=state.graphic.src;graphic.style.objectFit=state.graphic.fit||'contain';position(graphic,state.graphic.position);graphic.style.display='block';if(state.graphic.duration>0)imageTimer=setTimeout(()=>graphic.style.display='none',state.graphic.duration)}
    else{graphic.removeAttribute('src');graphic.style.display='none'}
    if(state.video?.src){
      const desired=new URL(state.video.src,location.href).href;
      video.style.objectFit=state.video.fit||'contain';position(video,state.video.position);video.volume=Math.max(0,Math.min(1,Number(state.video.volume??1)));video.style.display='block';
      if(video.src!==desired){currentVideoSrc=state.video.src;video.src=state.video.src;video.play().catch(()=>{})}
    } else {currentVideoSrc='';video.pause();video.removeAttribute('src');video.load();video.style.display='none'}
    if(state.text?.value){text.textContent=state.text.value;text.style.display='block';text.style.top=state.text.position==='top'?'6%':'';text.style.bottom=state.text.position==='top'?'':'6%'}else{text.textContent='';text.style.display='none'}
  }
  video.addEventListener('ended',()=>{video.style.display='none';if(ws?.readyState===1)ws.send(JSON.stringify({type:'event',event:'videoEnded',src:currentVideoSrc}))});
  function connect(){
    const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=overlay`);
    ws.onopen=()=>{retry=1000;setStatus('connected')};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')applyState(m.state||{})}catch{}};
    ws.onclose=()=>{setStatus('reconnecting');setTimeout(connect,retry);retry=Math.min(retry*1.6,10000)};ws.onerror=()=>ws.close();
  } connect();
})();
</script>
</body>
</html>
