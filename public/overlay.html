<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Stream Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
*{box-sizing:border-box}
#stage{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#graphics{position:absolute;inset:0}
.graphic{position:absolute;display:block;object-fit:contain}
#video{position:absolute;display:none;object-fit:contain}
#text{
  position:absolute;left:3%;right:3%;bottom:5%;display:none;overflow:hidden;
  color:#ffffff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-weight:800;
  line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.95);white-space:nowrap
}
#text.static{text-align:center}
#text.static #textInner{display:inline-block;white-space:normal}
#text.scroll{text-align:left;overflow:hidden}
#text.scroll #textInner{display:inline-block;white-space:nowrap;will-change:transform}
@keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#rideWait{position:absolute;display:none;pointer-events:none}
#rideWait .ride-card{
  width:100%;background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:14px;
  text-align:center;font-family:Arial,Helvetica,sans-serif;
  box-shadow:0 0 8px rgba(0,0,0,.35);
}
#rideWait .ride-name{font-size:clamp(18px,2.8vw,54px);font-weight:700;line-height:1.08;word-break:break-word}
#rideWait .wait-time{margin-top:4px;font-size:clamp(28px,5.6vw,96px);font-weight:900;line-height:1.0;white-space:nowrap}
#rideWait .credit{margin-top:5px;font-size:clamp(9px,1vw,16px);opacity:.78;white-space:nowrap}
#rideWait.green .ride-card{background:rgba(0,160,0,.9);animation:pulseGreen 2s ease-in-out infinite}
#rideWait.yellow .ride-card{background:rgba(220,170,0,.9);animation:pulseYellow 2.2s ease-in-out infinite}
#rideWait.red .ride-card{background:rgba(180,0,0,.9);animation:pulseRed 1.6s ease-in-out infinite}
@keyframes pulseGreen{0%,100%{transform:scale(1);box-shadow:0 0 6px rgba(0,255,0,.4)}50%{transform:scale(1.03);box-shadow:0 0 16px rgba(0,255,0,.7)}}
@keyframes pulseYellow{0%,100%{transform:scale(1);box-shadow:0 0 4px rgba(255,230,0,.3)}50%{transform:scale(1.02);box-shadow:0 0 14px rgba(255,230,0,.7)}}
@keyframes pulseRed{0%,100%{transform:scale(1);box-shadow:0 0 4px rgba(255,0,0,.4)}50%{transform:scale(1.05);box-shadow:0 0 20px rgba(255,0,0,.9)}}

#weather{position:absolute;display:none;pointer-events:none;transform-origin:center center}
#weather .weather-card{
  width:420px;height:180px;box-sizing:border-box;padding:12px 16px;border-radius:18px;
  background:rgba(10,10,20,.75);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);display:grid;grid-template-columns:110px 1fr;
  column-gap:12px;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.45);
  color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
#weather .w-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#weather .w-icon{font-size:42px;line-height:1}
#weather .w-temp{font-size:30px;font-weight:700}
#weather .w-feels{font-size:12px;color:#cfd8dc}
#weather .w-right{display:flex;flex-direction:column;gap:4px}
#weather .w-location{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
#weather .w-condition{font-size:13px;color:#cfd8dc}
#weather .w-rain-row{margin-top:6px;display:flex;flex-direction:column;gap:4px}
#weather .w-rain-header{display:flex;justify-content:space-between;font-size:13px;align-items:center;gap:8px}
#weather .w-rain-percent{font-weight:600}
#weather .w-rain-percent.high{color:#ff5252}
#weather .w-rain-percent.low{color:#4caf50}
#weather .w-rain-bar{width:100%;height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
#weather .w-rain-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,rgba(79,195,247,.25),#4fc3f7);transition:width .6s ease-out}
#weather .w-meta{margin-top:2px;font-size:11px;color:#cfd8dc;opacity:.85;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
#weather .w-footer{margin-top:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600;padding-top:4px;border-top:1px solid rgba(255,255,255,.15)}
#weather .w-channel{opacity:.85}
#weather .w-subscribe{color:#ff5252;animation:weatherPulse 1.4s infinite}
@keyframes weatherPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}

#status{display:none;position:absolute;top:8px;left:8px;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font:12px system-ui,sans-serif}
</style>
</head>
<body>
<div id="stage">
  <div id="graphics"></div>
  <video id="video" playsinline preload="metadata"></video>
  <div id="text" class="static"><span id="textInner"></span></div>
  <div id="rideWait">
    <div class="ride-card">
      <div id="rideName" class="ride-name"></div>
      <div id="rideTime" class="wait-time">--</div>
      <div class="credit">Powered by Queue-Times.com</div>
    </div>
  </div>
  <div id="weather">
    <div class="weather-card">
      <div class="w-left">
        <div id="wIcon" class="w-icon">⛅</div>
        <div id="wTemp" class="w-temp">--°</div>
        <div id="wFeels" class="w-feels">feels like --°</div>
      </div>
      <div class="w-right">
        <div class="w-location"><span>📍</span><span id="wLocation">Walt Disney World</span></div>
        <div id="wCondition" class="w-condition">Loading current weather…</div>
        <div class="w-rain-row">
          <div class="w-rain-header"><span>🌧️ Rain next hour</span><span id="wRainPct" class="w-rain-percent">--%</span></div>
          <div class="w-rain-bar"><div id="wRainFill" class="w-rain-fill"></div></div>
        </div>
        <div class="w-meta">
          <span id="wDailyRain">High today: --%</span>
          <span id="wPrecip">Precip: -- in</span>
          <span id="wUpdated">Updated: --</span>
        </div>
        <div class="w-footer"><span class="w-channel">Not So Scary Mary TV</span><span class="w-subscribe">🔥 Subscribe!</span></div>
      </div>
    </div>
  </div>
  <div id="status"></div>
</div>
<script>
(() => {
  const q=new URLSearchParams(location.search), room=q.get('room')||'default', debug=q.get('debug')==='1';
  const graphics=document.querySelector('#graphics'), video=document.querySelector('#video'), text=document.querySelector('#text'), textInner=document.querySelector('#textInner'), rideWait=document.querySelector('#rideWait'), rideName=document.querySelector('#rideName'), rideTime=document.querySelector('#rideTime'), weather=document.querySelector('#weather'), wIcon=document.querySelector('#wIcon'), wTemp=document.querySelector('#wTemp'), wFeels=document.querySelector('#wFeels'), wLocation=document.querySelector('#wLocation'), wCondition=document.querySelector('#wCondition'), wRainPct=document.querySelector('#wRainPct'), wRainFill=document.querySelector('#wRainFill'), wDailyRain=document.querySelector('#wDailyRain'), wPrecip=document.querySelector('#wPrecip'), wUpdated=document.querySelector('#wUpdated'), status=document.querySelector('#status');
  let ws,retry=1000,currentVideoSrc=''; const timers=new Map(); if(debug)status.style.display='block';
  let rideItems=[],rideIndex=0,rideCycleTimer=null,rideRefreshTimer=null,rideConfigKey='';
  let weatherRefreshTimer=null,weatherConfigKey='';
  const setStatus=s=>{if(debug)status.textContent=s};
  const allowedPositions=new Set(['center','top','bottom','left','right','top-left','top-right','bottom-left','bottom-right']);

  function place(el,pos,size){
    const safe=allowedPositions.has(pos)?pos:'center';
    const pct=Math.max(10,Math.min(100,Number(size||40)));
    Object.assign(el.style,{inset:'auto',top:'auto',right:'auto',bottom:'auto',left:'auto',width:`${pct}%`,height:'auto',maxWidth:`${pct}%`,maxHeight:'90%',transform:'none'});
    if(safe==='center'){
      el.style.left='50%';el.style.top='50%';el.style.transform='translate(-50%,-50%)';
    } else if(safe==='top'){
      el.style.left='50%';el.style.top='4%';el.style.transform='translateX(-50%)';
    } else if(safe==='bottom'){
      el.style.left='50%';el.style.bottom='4%';el.style.transform='translateX(-50%)';
    } else if(safe==='left'){
      el.style.left='4%';el.style.top='50%';el.style.transform='translateY(-50%)';
    } else if(safe==='right'){
      el.style.right='4%';el.style.top='50%';el.style.transform='translateY(-50%)';
    } else {
      if(safe.startsWith('top'))el.style.top='4%';else el.style.bottom='4%';
      if(safe.endsWith('left'))el.style.left='4%';else el.style.right='4%';
    }
  }

  function renderGraphics(state){
    const items=Array.isArray(state.graphics)
      ? state.graphics.filter(g=>g?.src)
      : (state.graphic?.src ? [{...state.graphic,id:state.graphic.id||state.graphic.src,size:40}] : []);

    const wanted=new Map(items.map(g=>[String(g.id||g.src),g]));

    for(const child of [...graphics.children]){
      if(!wanted.has(child.dataset.id)){
        clearTimeout(timers.get(child.dataset.id));
        timers.delete(child.dataset.id);
        child.remove();
      }
    }

    for(const g of items){
      const id=String(g.id||g.src);
      let img=[...graphics.children].find(x=>x.dataset.id===id);

      if(!img){
        img=document.createElement('img');
        img.className='graphic';
        img.dataset.id=id;
        img.alt='';
        graphics.appendChild(img);
      }

      if(img.getAttribute('src')!==g.src)img.src=g.src;
      img.style.objectFit=g.fit||'contain';
      place(img,g.position,g.size);

      clearTimeout(timers.get(id));
      if(Number(g.duration)>0){
        timers.set(id,setTimeout(()=>{
          img.remove();
          timers.delete(id);
          if(ws?.readyState===1){
            ws.send(JSON.stringify({type:'event',event:'imageExpired',id,src:g.src}));
          }
        },Number(g.duration)));
      }
    }
  }

  function positionVideo(el,pos){
    Object.assign(el.style,{inset:'auto',top:'0',left:'0',width:'100%',height:'100%',maxWidth:'100%',maxHeight:'100%',transform:'none'});
  }


  const OMITTED_RIDES=new Set([
    "A Pirate's Adventure ~ Treasures of the Seven Seas",
    "Main Street Vehicles",
    "Casey Jr. Splash 'N' Soak Station"
  ]);
  const RIDE_ALIASES={
    "Expedition Everest - Legend of the Forbidden Mountain":"Expedition Everest",
    "Millennium Falcon: Smugglers Run":"Smugglers Run",
    "Journey of Water, Inspired by Moana":"Moana – Journey of Water"
  };

  function rideList(data){
    const out=[];
    for(const land of (data?.lands||[])){
      for(const r of (land.rides||[])){
        if(!r?.name||OMITTED_RIDES.has(r.name))continue;
        out.push(r);
      }
    }
    return out;
  }

  function renderRide(){
    if(!rideItems.length){
      rideWait.style.display='none';
      return;
    }
    const r=rideItems[rideIndex % rideItems.length];
    rideWait.style.display='block';
    rideWait.className='';
    rideName.textContent=RIDE_ALIASES[r.name]||r.name;
    const raw=typeof r.wait_time==='number'?r.wait_time:null;
    rideTime.textContent=raw!==null?`${raw} min`:(r.is_open!==false?'—':'Closed');
    if(raw!==null){
      if(raw<=30)rideWait.classList.add('green');
      else if(raw<=60)rideWait.classList.add('yellow');
      else rideWait.classList.add('red');
    }
  }

  function stopRideTimers(){
    clearInterval(rideCycleTimer); rideCycleTimer=null;
    clearInterval(rideRefreshTimer); rideRefreshTimer=null;
  }

  async function refreshRideWait(cfg){
    try{
      const r=await fetch(`/ride-waits-data?park=${encodeURIComponent(cfg.park)}`,{cache:'no-store'});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const data=await r.json();
      rideItems=rideList(data);
      rideIndex=0;
      renderRide();
    }catch(e){
      console.warn('Ride waits:',e);
      rideItems=[];
      rideWait.style.display='none';
    }
  }

  function applyRideWait(cfg){
    if(!cfg){
      rideConfigKey='';
      rideItems=[];
      stopRideTimers();
      rideWait.style.display='none';
      return;
    }

    place(rideWait,cfg.position,cfg.size);
    rideWait.style.maxHeight='none';

    const key=`${cfg.park}|${cfg.position}|${cfg.size}|${cfg.cycle}`;
    if(key===rideConfigKey){
      renderRide();
      return;
    }
    rideConfigKey=key;
    stopRideTimers();
    refreshRideWait(cfg);
    rideCycleTimer=setInterval(()=>{
      if(!rideItems.length)return;
      rideIndex=(rideIndex+1)%rideItems.length;
      renderRide();
    },Math.max(3,Number(cfg.cycle||10))*1000);
    rideRefreshTimer=setInterval(()=>refreshRideWait(cfg),300000);
  }


  function weatherDescription(code){
    if(code===0)return{icon:'☀️',text:'Clear sky'};
    if([1,2].includes(code))return{icon:'🌤️',text:'Mostly sunny'};
    if(code===3)return{icon:'⛅',text:'Cloudy'};
    if([45,48].includes(code))return{icon:'🌫️',text:'Foggy'};
    if([51,53,55].includes(code))return{icon:'🌦️',text:'Drizzle'};
    if([61,63,65].includes(code))return{icon:'🌧️',text:'Rain'};
    if([66,67].includes(code))return{icon:'🌧️❄️',text:'Freezing rain'};
    if([71,73,75,77].includes(code))return{icon:'❄️',text:'Snow'};
    if([80,81,82].includes(code))return{icon:'🌦️',text:'Showers'};
    if([95,96,99].includes(code))return{icon:'⛈️',text:'Thunderstorms'};
    return{icon:'❓',text:'Unknown conditions'};
  }

  function formatWeatherTime(iso){
    try{return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
    catch{return'--';}
  }


  function nextHourRainChance(data){
    const times=Array.isArray(data?.hourly?.time)?data.hourly.time:[];
    const probs=Array.isArray(data?.hourly?.precipitation_probability)?data.hourly.precipitation_probability:[];
    if(!times.length || !probs.length) return 0;

    const currentTime = data?.current?.time ? new Date(data.current.time).getTime() : Date.now();

    // Prefer the first forecast hour at or after the current weather timestamp.
    for(let i=0;i<times.length;i++){
      const t=new Date(times[i]).getTime();
      if(Number.isFinite(t) && t>=currentTime){
        const p=Number(probs[i]);
        return Number.isFinite(p)?p:0;
      }
    }

    const last=Number(probs[probs.length-1]);
    return Number.isFinite(last)?last:0;
  }

  async function refreshWeather(cfg){
    try{
      const r=await fetch(`/weather-data?park=${encodeURIComponent(cfg.park)}&unit=${encodeURIComponent(cfg.unit)}`,{cache:'no-store'});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const data=await r.json();
      const current=data.current||{},daily=data.daily||{};
      const temp=Math.round(current.temperature_2m);
      const feels=Math.round(current.apparent_temperature);
      const precip=current.precipitation!=null?Number(current.precipitation).toFixed(2):null;
      const nextHourChance=nextHourRainChance(data);
      const dailyMax=Array.isArray(daily.precipitation_probability_max)?daily.precipitation_probability_max[0]:0;
      const desc=weatherDescription(current.weather_code||0);
      const clamped=Math.max(0,Math.min(100,Number(nextHourChance||0)));
      const dailyClamped=Math.max(0,Math.min(100,Number(dailyMax||0)));

      wIcon.textContent=desc.icon;
      wTemp.textContent=`${temp}°`;
      wFeels.textContent=`feels like ${feels}°`;
      wLocation.textContent=data.overlay_location_name||'Walt Disney World';
      wCondition.textContent=desc.text;
      wRainPct.textContent=`${Math.round(clamped)}%`;
      wRainPct.classList.remove('high','low');
      if(clamped>=60)wRainPct.classList.add('high');
      else if(clamped<=30)wRainPct.classList.add('low');
      wRainFill.style.width=`${clamped}%`;
      wDailyRain.textContent=`High today: ${Math.round(dailyClamped)}%`;
      wPrecip.textContent=`Precip: ${precip!=null?precip+' in':'--'}`;
      wUpdated.textContent=`Updated: ${current.time?formatWeatherTime(current.time):'--'}`;
      weather.style.display='block';
    }catch(e){
      console.warn('Weather:',e);
      weather.style.display='none';
    }
  }

  function applyWeather(cfg){
    if(!cfg){
      weatherConfigKey='';
      clearInterval(weatherRefreshTimer); weatherRefreshTimer=null;
      weather.style.display='none';
      return;
    }

    const size=Math.max(10,Number(cfg.size||40));
    const scale=size/100;
    weather.style.width='420px';
    weather.style.height='180px';
    weather.style.left=weather.style.right=weather.style.top=weather.style.bottom='auto';

    const pos=cfg.position||'top-right';
    const margin=16;
    if(pos.includes('left')) weather.style.left=`${margin}px`;
    else if(pos.includes('right')) weather.style.right=`${margin}px`;
    else weather.style.left='50%';

    if(pos.includes('top')) weather.style.top=`${margin}px`;
    else if(pos.includes('bottom')) weather.style.bottom=`${margin}px`;
    else weather.style.top='50%';

    const transforms=[`scale(${scale})`];
    if(!pos.includes('left')&&!pos.includes('right')) transforms.push('translateX(-50%)');
    if(!pos.includes('top')&&!pos.includes('bottom')) transforms.push('translateY(-50%)');
    weather.style.transform=transforms.join(' ');

    const key=`${cfg.park}|${cfg.position}|${cfg.size}|${cfg.unit}`;
    if(key===weatherConfigKey){
      weather.style.display='block';
      return;
    }
    weatherConfigKey=key;
    clearInterval(weatherRefreshTimer);
    refreshWeather(cfg);
    weatherRefreshTimer=setInterval(()=>refreshWeather(cfg),600000);
  }

  function applyText(t){
    if(!t?.value){textInner.textContent='';text.style.display='none';return}
    textInner.textContent=t.value;text.style.display='block';
    text.style.top=t.position==='top'?'5%':'';text.style.bottom=t.position==='top'?'':'5%';
    text.style.color=t.color||'#ffffff';text.style.fontSize=`${Math.max(18,Math.min(120,Number(t.size||48)))}px`;
    const fonts={system:'system-ui,-apple-system,Segoe UI,sans-serif',arial:'Arial,sans-serif',georgia:'Georgia,serif',impact:'Impact,Haettenschweiler,sans-serif',comic:'"Comic Sans MS","Comic Sans",cursive'};
    text.style.fontFamily=fonts[t.font]||fonts.system;
    const scrolling=Boolean(t.scroll);text.className=scrolling?'scroll':'static';
    textInner.style.animation='none';void textInner.offsetWidth;
    if(scrolling){const seconds=Math.max(5,Math.min(40,Number(t.scrollSeconds||12)));textInner.style.animation=`ticker ${seconds}s linear infinite`}
    else{textInner.style.transform='none'}
  }

  function applyState(state){
    renderGraphics(state);
    if(state.video?.src){
      const desired=new URL(state.video.src,location.href).href;
      video.style.objectFit=state.video.fit||'contain';positionVideo(video,state.video.position);video.volume=Math.max(0,Math.min(1,Number(state.video.volume??1)));video.style.display='block';
      if(video.src!==desired){currentVideoSrc=state.video.src;video.src=state.video.src;video.play().catch(()=>{})}
    } else {currentVideoSrc='';video.pause();video.removeAttribute('src');video.load();video.style.display='none'}
    applyText(state.text);
    applyRideWait(state.rideWait);
    applyWeather(state.weather);
  }

  video.addEventListener('ended',()=>{video.style.display='none';if(ws?.readyState===1)ws.send(JSON.stringify({type:'event',event:'videoEnded',src:currentVideoSrc}))});
  function connect(){
    const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=overlay`);
    ws.onopen=()=>{retry=1000;setStatus('connected')};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')applyState(m.state||{})}catch{}};
    ws.onclose=()=>{setStatus('reconnecting');setTimeout(connect,retry);retry=Math.min(retry*1.6,10000)};ws.onerror=()=>ws.close();
  } connect();
})();
</script>
</body>
</html>
