<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Stream Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
*{box-sizing:border-box}
#stage{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#graphics{position:absolute;inset:0}
.graphic{position:absolute;display:block;object-fit:contain;opacity:1;will-change:transform,opacity}
.graphic.animating{transition-property:transform,opacity;transition-timing-function:ease}
.graphic.in-fade{opacity:0}
.graphic.in-slide-up{opacity:0;transform:translate(-50%,calc(-50% + 40px))}
.graphic.in-slide-down{opacity:0;transform:translate(-50%,calc(-50% - 40px))}
.graphic.in-slide-left{opacity:0;transform:translate(calc(-50% + 40px),-50%)}
.graphic.in-slide-right{opacity:0;transform:translate(calc(-50% - 40px),-50%)}
.graphic.in-zoom{opacity:0;transform:translate(-50%,-50%) scale(.78)}
.graphic.in-pop{opacity:0;transform:translate(-50%,-50%) scale(.55)}
.graphic.out-fade{opacity:0!important}
.graphic.out-slide-up{opacity:0!important;transform:translateY(-40px)!important}
.graphic.out-slide-down{opacity:0!important;transform:translateY(40px)!important}
.graphic.out-slide-left{opacity:0!important;transform:translateX(-40px)!important}
.graphic.out-slide-right{opacity:0!important;transform:translateX(40px)!important}
.graphic.out-zoom{opacity:0!important;transform:scale(.78)!important}
.graphic.out-pop{opacity:0!important;transform:scale(.55)!important}
#video{position:absolute;display:none;object-fit:contain}
#text{
  position:absolute;left:3%;right:3%;bottom:5%;display:none;overflow:hidden;
  color:#ffffff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-weight:800;
  line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.95);white-space:nowrap
}
#text.static{text-align:center}
#text.static #textInner{display:inline-block;white-space:normal}
#text.scroll{text-align:left;overflow:hidden}
#text.scroll #textInner{display:inline-block;white-space:nowrap;will-change:transform}
@keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#status{display:none;position:absolute;top:8px;left:8px;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font:12px system-ui,sans-serif}
</style>
</head>
<body>
<div id="stage">
  <div id="graphics"></div>
  <video id="video" playsinline preload="metadata"></video>
  <div id="text" class="static"><span id="textInner"></span></div>
  <div id="status"></div>
</div>
<script>
(() => {
  const q=new URLSearchParams(location.search), room=q.get('room')||'default', debug=q.get('debug')==='1';
  const graphics=document.querySelector('#graphics'), video=document.querySelector('#video'), text=document.querySelector('#text'), textInner=document.querySelector('#textInner'), status=document.querySelector('#status');
  let ws,retry=1000,currentVideoSrc=''; const timers=new Map(); if(debug)status.style.display='block';
  const setStatus=s=>{if(debug)status.textContent=s};
  const allowedPositions=new Set(['center','top','bottom','left','right','top-left','top-right','bottom-left','bottom-right']);

  function place(el,pos,size){
    const safe=allowedPositions.has(pos)?pos:'center';
    const pct=Math.max(10,Math.min(100,Number(size||40)));
    Object.assign(el.style,{inset:'auto',top:'auto',right:'auto',bottom:'auto',left:'auto',width:`${pct}%`,height:'auto',maxWidth:`${pct}%`,maxHeight:'90%',transform:'none'});
    if(safe==='center'){
      el.style.left='50%';el.style.top='50%';el.style.transform='translate(-50%,-50%)';
    } else if(safe==='top'){
      el.style.left='50%';el.style.top='4%';el.style.transform='translateX(-50%)';
    } else if(safe==='bottom'){
      el.style.left='50%';el.style.bottom='4%';el.style.transform='translateX(-50%)';
    } else if(safe==='left'){
      el.style.left='4%';el.style.top='50%';el.style.transform='translateY(-50%)';
    } else if(safe==='right'){
      el.style.right='4%';el.style.top='50%';el.style.transform='translateY(-50%)';
    } else {
      if(safe.startsWith('top'))el.style.top='4%';else el.style.bottom='4%';
      if(safe.endsWith('left'))el.style.left='4%';else el.style.right='4%';
    }
  }

  function baseTransformFor(pos){
    const safe=allowedPositions.has(pos)?pos:'center';
    if(safe==='center') return 'translate(-50%,-50%)';
    if(safe==='top' || safe==='bottom') return 'translateX(-50%)';
    if(safe==='left' || safe==='right') return 'translateY(-50%)';
    return 'none';
  }

  function inStartTransform(pos,type){
    const base=baseTransformFor(pos);
    const map={
      'slide-up':'translateY(40px)',
      'slide-down':'translateY(-40px)',
      'slide-left':'translateX(40px)',
      'slide-right':'translateX(-40px)',
      'zoom':'scale(.78)',
      'pop':'scale(.55)'
    };
    if(type==='fade' || type==='none') return base;
    const extra=map[type]||'';
    return base==='none'?extra:`${base} ${extra}`;
  }

  function outTransform(pos,type){
    const base=baseTransformFor(pos);
    const map={
      'slide-up':'translateY(-40px)',
      'slide-down':'translateY(40px)',
      'slide-left':'translateX(-40px)',
      'slide-right':'translateX(40px)',
      'zoom':'scale(.78)',
      'pop':'scale(.55)'
    };
    if(type==='fade' || type==='none') return base;
    const extra=map[type]||'';
    return base==='none'?extra:`${base} ${extra}`;
  }

  function animateIn(img,g){
    const type=g.transitionIn||'fade';
    const ms=Math.max(100,Math.min(2000,Number(g.transitionMs||500)));
    img.style.transition='none';
    img.style.opacity=type==='none'?'1':'0';
    img.style.transform=inStartTransform(g.position,type);
    void img.offsetWidth;
    img.style.transition=`transform ${ms}ms ease, opacity ${ms}ms ease`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      img.style.opacity='1';
      img.style.transform=baseTransformFor(g.position);
    }));
  }

  function animateOut(img,g,onDone){
    if(img.dataset.removing==='1')return;
    img.dataset.removing='1';
    const type=g.transitionOut||'fade';
    const ms=Math.max(100,Math.min(2000,Number(g.transitionMs||500)));
    img.style.transition=`transform ${ms}ms ease, opacity ${ms}ms ease`;
    if(type==='none'){img.style.opacity='0';setTimeout(onDone,0);return}
    img.style.opacity='0';
    img.style.transform=outTransform(g.position,type);
    setTimeout(onDone,ms+30);
  }

  function renderGraphics(state){
    const items=Array.isArray(state.graphics)
      ? state.graphics
      : (state.graphic?.src ? [{...state.graphic,id:state.graphic.id||state.graphic.src,size:40}] : []);
    const wanted=new Set(items.map(g=>String(g.id||g.src)));

    for(const child of [...graphics.children]){
      if(!wanted.has(child.dataset.id)){
        clearTimeout(timers.get(child.dataset.id));
        timers.delete(child.dataset.id);
        child.remove();
      }
    }

    for(const g of items){
      if(!g?.src)continue;
      const id=String(g.id||g.src);
      let img=[...graphics.children].find(x=>x.dataset.id===id);
      const isNew=!img;

      if(!img){
        img=document.createElement('img');
        img.className='graphic';
        img.dataset.id=id;
        img.alt='';
        graphics.appendChild(img);
      }

      if(img.getAttribute('src')!==g.src)img.src=g.src;
      img.style.objectFit=g.fit||'contain';
      place(img,g.position,g.size);
      img.dataset.removing='0';

      if(isNew) animateIn(img,g);

      clearTimeout(timers.get(id));

      if(g.removeAt){
        animateOut(img,g,()=>{img.remove();timers.delete(id)});
        continue;
      }

      if(Number(g.duration)>0){
        const outMs=Math.max(100,Math.min(2000,Number(g.transitionMs||500)));
        const delay=Math.max(0,Number(g.duration)-outMs);
        timers.set(id,setTimeout(()=>{
          animateOut(img,g,()=>{img.remove();timers.delete(id)});
        },delay));
      }
    }
  }

  function positionVideo(el,pos){
    Object.assign(el.style,{inset:'auto',top:'0',left:'0',width:'100%',height:'100%',maxWidth:'100%',maxHeight:'100%',transform:'none'});
  }

  function applyText(t){
    if(!t?.value){textInner.textContent='';text.style.display='none';return}
    textInner.textContent=t.value;text.style.display='block';
    text.style.top=t.position==='top'?'5%':'';text.style.bottom=t.position==='top'?'':'5%';
    text.style.color=t.color||'#ffffff';text.style.fontSize=`${Math.max(18,Math.min(120,Number(t.size||48)))}px`;
    const scrolling=Boolean(t.scroll);text.className=scrolling?'scroll':'static';
    textInner.style.animation='none';void textInner.offsetWidth;
    if(scrolling){const seconds=Math.max(5,Math.min(40,Number(t.scrollSeconds||12)));textInner.style.animation=`ticker ${seconds}s linear infinite`}
    else{textInner.style.transform='none'}
  }

  function applyState(state){
    renderGraphics(state);
    if(state.video?.src){
      const desired=new URL(state.video.src,location.href).href;
      video.style.objectFit=state.video.fit||'contain';positionVideo(video,state.video.position);video.volume=Math.max(0,Math.min(1,Number(state.video.volume??1)));video.style.display='block';
      if(video.src!==desired){currentVideoSrc=state.video.src;video.src=state.video.src;video.play().catch(()=>{})}
    } else {currentVideoSrc='';video.pause();video.removeAttribute('src');video.load();video.style.display='none'}
    applyText(state.text);
  }

  video.addEventListener('ended',()=>{video.style.display='none';if(ws?.readyState===1)ws.send(JSON.stringify({type:'event',event:'videoEnded',src:currentVideoSrc}))});
  function connect(){
    const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(room)}?role=overlay`);
    ws.onopen=()=>{retry=1000;setStatus('connected')};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')applyState(m.state||{})}catch{}};
    ws.onclose=()=>{setStatus('reconnecting');setTimeout(connect,retry);retry=Math.min(retry*1.6,10000)};ws.onerror=()=>ws.close();
  } connect();
})();
</script>
</body>
</html>
